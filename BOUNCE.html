<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BOUNCE</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #10131c;
    color: white;
}

button, input {
    font: inherit;
}

.screen {
    position: fixed;
    inset: 0;
    display: none;
}

.screen.active {
    display: flex;
}

/* =====================================================
   ГЛАВНОЕ МЕНЮ
===================================================== */

#menu {
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at 50% 35%,
            #242b42 0%,
            #151927 40%,
            #0c0f17 100%
        );
}

.menu-box {
    width: min(1100px, 94vw);
    max-height: 94vh;
    overflow-y: auto;
    padding: 30px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    background: rgba(14,18,30,.94);
    box-shadow: 0 25px 80px rgba(0,0,0,.5);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    margin: 0;
    font-size: 48px;
    letter-spacing: 8px;
}

.logo p {
    margin: 8px 0 0;
    color: #8993ad;
}

.editor {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.panel {
    padding: 20px;
    border-radius: 18px;
    background: #191e2d;
    border: 1px solid rgba(255,255,255,.06);
}

.panel h2 {
    margin: 0 0 18px;
    font-size: 19px;
}

.colors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.color-input {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-radius: 12px;
    background: #111522;
}

.color-input input[type="color"] {
    width: 48px;
    height: 42px;
    padding: 2px;
    border: none;
    background: transparent;
    cursor: pointer;
}

.color-input span {
    font-size: 13px;
    color: #aeb7cc;
}

.slider {
    margin-top: 18px;
}

.slider-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 13px;
    color: #b8c0d2;
}

.slider-value {
    color: white;
    font-weight: bold;
}

input[type="range"] {
    width: 100%;
    accent-color: #6675ff;
    cursor: pointer;
}

/* =====================================================
   ПРЕДПРОСМОТР КУБА
===================================================== */

.cube-editor {
    display: flex;
    gap: 22px;
    align-items: flex-start;
}

.pixel-wrap {
    width: 320px;
    height: 320px;
    flex-shrink: 0;
    padding: 20px;
    border-radius: 16px;
    background: #0d1019;
    display: flex;
    align-items: center;
    justify-content: center;
}

#pixelCanvas {
    width: 256px;
    height: 256px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 3px solid #394057;
    cursor: crosshair;
}

.pixel-tools {
    flex: 1;
}

.current-color {
    height: 70px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 2px solid rgba(255,255,255,.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    text-shadow: 0 1px 3px #000;
}

.tool-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.small-btn,
.main-btn {
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    transition: .15s;
}

.small-btn {
    padding: 9px 13px;
    background: #292f43;
}

.small-btn:hover {
    background: #353d56;
}

.main-btn {
    display: block;
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
    background: linear-gradient(135deg,#5865f2,#7b61ff);
    box-shadow: 0 10px 30px rgba(88,101,242,.25);
}

.main-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

/* =====================================================
   УРОВНИ
===================================================== */

.level-panel {
    margin-top: 25px;
}

.levels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.level-btn {
    padding: 14px 8px;
    border: 2px solid #30374d;
    border-radius: 12px;
    background: #111522;
    color: white;
    cursor: pointer;
    transition: .15s;
}

.level-btn:hover {
    background: #252c40;
}

.level-btn.selected {
    border-color: #6675ff;
    background: #30375c;
    box-shadow: 0 0 20px rgba(102,117,255,.25);
}

.level-number {
    display: block;
    font-size: 20px;
    font-weight: bold;
}

.level-name {
    display: block;
    margin-top: 5px;
    font-size: 11px;
    color: #9da7bf;
}

.hint {
    margin-top: 15px;
    color: #707a91;
    font-size: 12px;
    line-height: 1.5;
}

/* =====================================================
   ИГРА
===================================================== */

#gameScreen {
    background: #10131c;
}

#game {
    position: absolute;
    inset: 0;
    display: block;
    cursor: crosshair;
}

.game-ui {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    padding: 14px 16px;
    color: white;
    background: rgba(15,18,30,.9);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    user-select: none;
}

.game-ui p {
    margin: 5px 0;
    color: #aeb7cc;
    font-size: 13px;
}

.game-buttons {
    display: flex;
    gap: 7px;
    margin-top: 9px;
}

.game-buttons button {
    padding: 7px 11px;
    border: none;
    border-radius: 7px;
    background: #5865f2;
    color: white;
    cursor: pointer;
}

.game-buttons button:hover {
    background: #6975ff;
}

#forceText {
    color: white;
    font-weight: bold;
}

#levelText {
    color: #ffffff;
    font-weight: bold;
}

#musicText {
    color: #7fe7ff;
    font-size: 12px;
}

/* =====================================================
   АДАПТИВ
===================================================== */

@media (max-width: 800px) {

    .editor {
        grid-template-columns: 1fr;
    }

    .cube-editor {
        flex-direction: column;
    }

    .pixel-wrap {
        width: 100%;
    }

    .logo h1 {
        font-size: 35px;
    }

    .levels {
        grid-template-columns: repeat(5, 1fr);
    }

    .level-name {
        display: none;
    }
}

/* =====================================================
   МОБИЛЬНОЕ УПРАВЛЕНИЕ
===================================================== */

#game {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
}

@media (max-width: 800px) {

    .game-ui {
        top: 10px;
        left: 10px;
        padding: 10px 12px;
        font-size: 12px;
    }

    .game-ui p {
        margin: 3px 0;
        font-size: 11px;
    }

    .game-buttons button {
        padding: 8px 10px;
    }

    .menu-box {
        padding: 18px;
    }

    .panel {
        padding: 15px;
    }

    .colors {
        grid-template-columns: 1fr;
    }

    .pixel-wrap {
        height: auto;
        aspect-ratio: 1;
    }

    #pixelCanvas {
        width: min(256px, 100%);
        height: auto;
        aspect-ratio: 1;
    }
}

/* =====================================================
   АВТОРИЗАЦИЯ
===================================================== */

.auth-panel {
    margin-bottom: 25px;
    padding: 16px;
    border-radius: 16px;
    background: #111522;
    border: 1px solid rgba(255,255,255,.06);
}

.auth-status {
    text-align: center;
    margin-bottom: 12px;
    color: #9da7bf;
    font-size: 14px;
}

.auth-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.auth-btn {
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    background: #292f43;
    color: white;
    cursor: pointer;
    transition: .15s;
    font-weight: bold;
}

.auth-btn:hover {
    background: #5865f2;
    transform: translateY(-1px);
}

.logout-btn {
    display: block;
    width: 100%;
    background: #3a2028;
}

.logout-btn:hover {
    background: #d6455d;
}

.auth-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.65);

    backdrop-filter: blur(8px);
}

.auth-modal.active {
    display: flex;
}

.auth-window {
    position: relative;

    width: min(400px, 90vw);

    padding: 28px;

    border-radius: 20px;

    background: #191e2d;

    border: 1px solid rgba(255,255,255,.08);

    box-shadow:
        0 30px 80px rgba(0,0,0,.6);
}

.auth-window h2 {
    margin: 0 0 20px;

    text-align: center;
}

.auth-window input {
    width: 100%;

    margin-bottom: 12px;

    padding: 13px 15px;

    border: 1px solid #30374d;
    border-radius: 10px;

    outline: none;

    background: #111522;
    color: white;
}

.auth-window input:focus {
    border-color: #6675ff;
}

.auth-close {
    position: absolute;

    top: 10px;
    right: 12px;

    border: none;

    background: none;

    color: #8e98b0;

    font-size: 28px;

    cursor: pointer;
}

.auth-submit {
    width: 100%;

    padding: 13px;

    border: none;
    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #7b61ff
        );

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.auth-error {
    min-height: 20px;

    margin-top: 12px;

    text-align: center;

    color: #ff657d;

    font-size: 13px;
}

/* =====================================================
   PLAYERS
===================================================== */

.players-panel {
    margin-top: 25px;
    padding: 20px;
    border-radius: 18px;
    background: #191e2d;
    border: 1px solid rgba(255,255,255,.06);
}

.players-panel h2 {
    margin: 0 0 15px;
}

.players-search input {
    width: 100%;
    padding: 13px 15px;
    border: 1px solid #30374d;
    border-radius: 10px;
    outline: none;
    background: #111522;
    color: white;
}

.players-search input:focus {
    border-color: #6675ff;
}

.players-list {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 12px;
    margin-top: 15px;
}

.player-card {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px;
    border-radius: 14px;
    background: #111522;
    border: 1px solid rgba(255,255,255,.06);
}

.player-cube {
    width: 64px;
    height: 64px;

    display: grid;
    grid-template-columns: repeat(8, 1fr);

    border: 2px solid #394057;
    border-radius: 6px;

    overflow: hidden;
    background: #0d1019;
}

.player-cube-pixel {
    width: 100%;
    aspect-ratio: 1;

    background:
        linear-gradient(
            45deg,
            #252a38 25%,
            #171b27 25%,
            #171b27 50%,
            #252a38 50%,
            #252a38 75%,
            #171b27 75%
        );

    background-size: 8px 8px;
}

.player-name {
    min-width: 0;
    flex: 1;
    overflow: hidden;
}

.player-name strong {
    display: block;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.player-name span,
.player-name small {
    display: block;
    margin-top: 4px;
    color: #707a91;
    font-size: 11px;
}

.players-empty {
    padding: 20px;
    text-align: center;
    color: #707a91;
}

.players-loading {
    padding: 20px;
    text-align: center;
    color: #707a91;
}

.players-toggle {
    display: flex;
    align-items: center;
    gap: 10px;
    cursor: pointer;
    color: white;
    user-select: none;
}

.players-toggle input {
    width: 18px;
    height: 18px;
    cursor: pointer;
}

/* =====================================================
   ЧАТ BOUNCE
===================================================== */

.chat-panel {
    position: fixed;
    left: 15px;
    bottom: 15px;
    z-index: 20;
    width: min(360px, calc(100vw - 30px));
    padding: 12px;
    background: rgba(15, 18, 30, 0.94);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 14px;
    box-shadow: 0 10px 35px rgba(0, 0, 0, 0.35);
    backdrop-filter: blur(8px);
}

.chat-title {
    margin-bottom: 10px;
    font-size: 14px;
    font-weight: bold;
    color: #aebaff;
}

.chat-messages {
    display: flex;
    flex-direction: column;
    gap: 7px;
    height: 180px;
    overflow-y: auto;
    overflow-wrap: anywhere;
    padding: 4px;
    margin-bottom: 10px;
    scrollbar-width: thin;
    scrollbar-color: #394057 transparent;
}

.chat-line {
    color: #ffffff;
    font-size: 12px;
    line-height: 1.45;
}

.chat-line.system {
    color: #7fe7ff;
}

.chat-form {
    display: flex;
    gap: 7px;
}

.chat-form input {
    width: 0;
    min-width: 0;
    flex: 1;
    padding: 10px;
    border: 1px solid #30374d;
    border-radius: 8px;
    outline: none;
    background: #111522;
    color: white;
}

.chat-form input:focus {
    border-color: #6675ff;
}

.chat-form button {
    padding: 9px 11px;
    border: none;
    border-radius: 8px;
    background: #5865f2;
    color: white;
    cursor: pointer;
}

.chat-form button:hover {
    background: #6975ff;
}

@media (max-width: 800px) {
    .chat-panel {
        left: 10px;
        bottom: 10px;
        width: min(330px, calc(100vw - 20px));
        padding: 9px;
    }

    .chat-messages {
        height: 125px;
    }
}

</style>
</head>

<body>

<!-- =====================================================
     ГЛАВНОЕ МЕНЮ
===================================================== -->

<section id="menu" class="screen active">

    <div class="menu-box">

        <div class="logo">
            <h1>BOUNCE</h1>
        </div>

        <div class="editor">

            <!-- ЦВЕТА -->

            <div class="panel">

                <h2>Настройка цветов</h2>

                <div class="colors">

                    <label class="color-input">
                        <input
                            type="color"
                            id="color1"
                            value="#ff0000"
                        >
                        <span>Главный цвет</span>
                    </label>

                    <label class="color-input">
                        <input
                            type="color"
                            id="color2"
                            value="#ffff00"
                        >
                        <span>Детальный цвет</span>
                    </label>

                </div>

                <!-- СМЕШИВАНИЕ -->

                <div class="slider">

                    <div class="slider-title">
                        <span>Смешивание</span>
                        <span
                            class="slider-value"
                            id="mixValue"
                        >
                            0%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="mix"
                        min="0"
                        max="100"
                        value="0"
                    >

                </div>

                <!-- БЛЕДНОСТЬ -->

                <div class="slider">

                    <div class="slider-title">
                        <span>Бледность</span>
                        <span
                            class="slider-value"
                            id="lightValue"
                        >
                            0%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="light"
                        min="0"
                        max="100"
                        value="0"
                    >

                </div>

                <!-- ТЬМА -->

                <div class="slider">

                    <div class="slider-title">
                        <span>Тьма</span>
                        <span
                            class="slider-value"
                            id="darkValue"
                        >
                            0%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="dark"
                        min="0"
                        max="100"
                        value="0"
                    >

                </div>

                <!-- ПРОЗРАЧНОСТЬ -->

                <div class="slider">

                    <div class="slider-title">
                        <span>Прозрачность</span>
                        <span
                            class="slider-value"
                            id="opacityValue"
                        >
                            100%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="opacity"
                        min="0"
                        max="100"
                        value="100"
                    >

                </div>

                <div
                    class="current-color"
                    id="colorPreview"
                >
                    #FF7A1A
                </div>

            </div>


            <!-- ПИКСЕЛЬНЫЙ КУБ -->

            <div class="panel">

                <h2>Your cube</h2>

                <div class="cube-editor">

                    <div class="pixel-wrap">

                        <canvas
                            id="pixelCanvas"
                            width="256"
                            height="256"
                        ></canvas>

                    </div>

                    <div class="pixel-tools">

                        <div class="tool-row">

                            <button
                                class="small-btn"
                                id="fillBtn"
                            >
                                Заполнить цветом
                            </button>

                            <button
                                class="small-btn"
                                id="clearBtn"
                            >
                                Очистить
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- УРОВНИ -->

        <div class="panel level-panel">

            <h2>Levels</h2>

            <label class="players-toggle">
                <input
                    type="checkbox"
                    id="playersCollisionToggle"
                >
                <span>Видеть игроков и включить коллизию</span>
            </label>


            <div class="levels">

                <button
                    class="level-btn selected"
                    data-level="1"
                >
                    <span class="level-number">1</span>
                    <span class="level-name">Tendo</span>
                </button>

                <button
                    class="level-btn"
                    data-level="2"
                >
                    <span class="level-number">2</span>
                    <span class="level-name">Infiltration</span>
                </button>

                <button
                    class="level-btn"
                    data-level="3"
                >
                    <span class="level-number">3</span>
                    <span class="level-name">Freaks</span>
                </button>

                <button
                    class="level-btn"
                    data-level="4"
                >
                    <span class="level-number">4</span>
                    <span class="level-name">The Ghost</span>
                </button>

                <button
                    class="level-btn"
                    data-level="5"
                >
                    <span class="level-number">5</span>
                    <span class="level-name">Into Pieces</span>
                </button>

            </div>

        </div>


        <button
            class="main-btn"
            id="startButton"
        >
            ▶ START
        </button>

    </div>

    <input
        type="text"
        id="nicknameInput"
        placeholder="Введите ник"
        maxlength="20"
        value="Игрок"
    >



    <div class="players-panel">

        <h2>Players</h2>

        <div class="players-search">
            <input
                type="text"
                id="playerSearch"
                placeholder="Поиск по нику..."
                autocomplete="off"
            >

            <button
                id="playerSearchButton"
                class="auth-btn"
                type="button"
            >
                Найти
            </button>
        </div>

        <div id="playersList" class="players-list">
            <div class="players-loading">
                Загрузка игроков...
            </div>
        </div>

    </div>





</section>


<!-- =====================================================
     ИГРА
===================================================== -->

<section id="gameScreen" class="screen">

    <canvas id="game"></canvas>

    <div class="game-ui">

        <p id="levelText">
            Уровень: 1
        </p>

        <p id="musicText">
            ♪ Музыка
        </p>

        <p
            id="forceText"
            style="display: none;"
        >
            Сила: 0 / 200
        </p>

        <div class="game-buttons">

            <button onclick="resetGame()">
                Restart
            </button>

            <button onclick="backToMenu()">
                Menu
            </button>

        </div>

    </div>

    <!-- =====================================================
         ЧАТ BOUNCE
    ===================================================== -->
    <div class="chat-panel" id="chatPanel">
        <div class="chat-title">BOUNCE CHAT</div>
        <div class="chat-messages" id="chatMessages" aria-live="polite">
            <div class="chat-line system">сервер - Добро пожаловать в BOUNCE!</div>
        </div>
        <form class="chat-form" id="chatForm">
            <input type="text" id="chatInput" placeholder="Написать сообщение..." maxlength="200" autocomplete="off">
            <button type="submit">Отправить</button>
        </form>
    </div>

</section>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io({
    withCredentials: true
});

// Уровень игрока нужен уже при начальной загрузке поиска и сетевого подключения.
let selectedLevel = 1;

/* =====================================================
   CHAT CLIENT
===================================================== */
const chatMessages = document.getElementById("chatMessages");
const chatForm = document.getElementById("chatForm");
const chatInput = document.getElementById("chatInput");
let lastDeathReportAt = 0;

function addChatMessage(data) {
    if (!data || typeof data !== "object" || !chatMessages) return;

    const line = document.createElement("div");
    const isSystem = data.type === "system";
    line.className = isSystem ? "chat-line system" : "chat-line";

    const username = String(data.username || "Игрок").slice(0, 20);
    const message = String(data.message || "").slice(0, 200);
    line.textContent = isSystem
        ? `сервер - ${message}`
        : `"${username}" - ${message}`;

    chatMessages.appendChild(line);
    while (chatMessages.children.length > 100) {
        chatMessages.removeChild(chatMessages.firstElementChild);
    }
    chatMessages.scrollTop = chatMessages.scrollHeight;
}

socket.on("chat:message", addChatMessage);

if (chatForm && chatInput) {

socket.on("players:update", serverPlayers => {
    if (!serverPlayers || typeof serverPlayers !== "object") return;

    const incomingPlayers = Array.isArray(serverPlayers)
        ? serverPlayers.filter(Boolean).map((player, index) => ({
            ...player,
            id: player.id ?? String(index)
        }))
        : Object.entries(serverPlayers)
            .filter(([, player]) => player && typeof player === "object")
            .map(([id, player]) => ({ ...player, id: player.id ?? id }));

    // Сервер присылает только игроков текущего уровня.
    // Полностью заменяем старый список, чтобы после смены карты
    // игроки с предыдущей карты не оставались в памяти клиента.
    for (const id of Object.keys(players)) delete players[id];
    for (const player of incomingPlayers) {
        players[String(player.id)] = player;
    }

    const directorySignature = JSON.stringify(
        incomingPlayers.map(player => ({
            id: player.id,
            level: player.level,
            nickname: String(player.nickname ?? player.username ?? player.name ?? "Игрок"),
            pixels: player.pixels ?? player.cubePixels ?? null,
            size: player.size ?? null
        }))
    );

    if (directorySignature !== lastPlayersDirectorySignature) {
        lastPlayersDirectorySignature = directorySignature;
        allPlayers = incomingPlayers;
        if (playersList) renderPlayers(playerSearch?.value ?? "");
    }
});

socket.on("player:left", playerId => {

async function loadPlayers(search = "") {
    const query = String(search ?? "").trim();

    playersList.innerHTML = `
        <div class="players-loading">Загрузка игроков...</div>
    `;

    try {
        const response = await fetch(
            "/api/players?level=" + encodeURIComponent(String(selectedLevel)) +
            "&search=" + encodeURIComponent(query),
            {
                method: "GET",
                credentials: "include",
                headers: { Accept: "application/json" }
            }
        );

        if (!response.ok) {
            throw new Error(`HTTP ${response.status}`);
        }

        const data = await response.json();
        allPlayers = Array.isArray(data)
            ? data
            : Array.isArray(data?.players)
                ? data.players
                : [];

        renderPlayers(query);
    } catch (error) {
        console.error("PLAYERS ERROR:", error);
        playersList.innerHTML = `
            <div class="players-empty">Не удалось загрузить игроков</div>
        `;
    }
}

function renderPlayers(search = "") {
    const query = String(search ?? "").trim().toLocaleLowerCase();

    // Ищем только по нику. Внутренний сетевой ID в интерфейсе не показываем.
    const filteredPlayers = allPlayers.filter(player => {
        const nickname = String(
            player?.nickname ?? player?.username ?? player?.name ?? "Игрок"
        ).trim().toLocaleLowerCase();

        return !query || nickname.includes(query);
    });

    if (!filteredPlayers.length) {
        playersList.innerHTML = `
            <div class="players-empty">Игроки не найдены</div>
        `;
        return;
    }

    playersList.innerHTML = "";

    filteredPlayers.forEach(player => {
        const card = document.createElement("div");
        card.className = "player-card";

        // Пиксельный куб игрока. Сервер хранит его в поле pixels.
        const cube = document.createElement("div");
        cube.className = "player-cube";

        const cubePixels = Array.isArray(player.pixels)
            ? player.pixels
            : Array.isArray(player.cubePixels)
                ? player.cubePixels
                : null;

        for (let y = 0; y < 8; y++) {
            for (let x = 0; x < 8; x++) {
                const pixel = document.createElement("div");
                pixel.className = "player-cube-pixel";

                const color = cubePixels?.[y]?.[x];
                if (color && typeof color === "object") {
                    const r = Math.max(0, Math.min(255, Number(color.r) || 0));
                    const g = Math.max(0, Math.min(255, Number(color.g) || 0));
                    const b = Math.max(0, Math.min(255, Number(color.b) || 0));
                    const a = color.a == null
                        ? 1
                        : Math.max(0, Math.min(1, Number(color.a)));

                    pixel.style.background = `rgba(${r}, ${g}, ${b}, ${a})`;
                }

                cube.appendChild(pixel);
            }
        }

        const name = document.createElement("div");
        name.className = "player-name";

        const nickname = document.createElement("strong");
        nickname.textContent = String(
            player.nickname ?? player.username ?? player.name ?? "Игрок"
        );

        const status = document.createElement("span");
        status.textContent = "В сети";

        name.appendChild(nickname);
        name.appendChild(status);

        // В карточке не отображаем ID — только ник и куб.
        card.appendChild(cube);
        card.appendChild(name);
        playersList.appendChild(card);
    });
}

/* =====================================================
   ЦВЕТА
===================================================== */

const color1 =
    document.getElementById("color1");

const color2 =
    document.getElementById("color2");

const mix =
    document.getElementById("mix");

const light =
    document.getElementById("light");

    const dark =
    document.getElementById("dark");

const opacity =
    document.getElementById("opacity");


function hexToRgb(hex) {

    hex = hex.replace("#","");

    return {

        r: parseInt(
            hex.substring(0,2),
            16
        ),

        g: parseInt(
            hex.substring(2,4),
            16
        ),

        b: parseInt(
            hex.substring(4,6),
            16
        )
    };
}


function rgbToHex(r,g,b) {

    return "#" +

        [r,g,b]

        .map(v =>
            Math.round(v)
                .toString(16)
                .padStart(2,"0")
        )

        .join("")
        .toUpperCase();
}


/*
   Теперь цвет хранится как RGBA-объект.

   Например:

   {
       r: 255,
       g: 0,
       b: 0,
       a: 0.5
   }

   Благодаря этому прозрачность сохраняется
   отдельно для каждого пикселя.
*/

function getMixedColor() {

    const a =
        hexToRgb(color1.value);

    const b =
        hexToRgb(color2.value);

    const m =
        Number(mix.value) / 100;

    let r =
        a.r * (1-m) +
        b.r * m;

    let g =
        a.g * (1-m) +
        b.g * m;

    let bl =
        a.b * (1-m) +
        b.b * m;

    const l =
        Number(light.value) / 100;

    r += (255-r) * l;
    g += (255-g) * l;
    bl += (255-bl) * l;

    const d =
        Number(dark.value) / 100;

    r *= 1-d;
    g *= 1-d;
    bl *= 1-d;

    return {

        r: Math.round(r),

        g: Math.round(g),

        b: Math.round(bl),

        a: Number(opacity.value) / 100

    };
}


/*
   HEX нужен только для отображения
   текущего выбранного цвета.
*/

function getMixedHex() {

    const color =
        getMixedColor();

    return rgbToHex(
        color.r,
        color.g,
        color.b
    );
}


function updateColor() {

    const color =
        getMixedColor();

    const hex =
        rgbToHex(
            color.r,
            color.g,
            color.b
        );


    document.getElementById(

            ${color.r},

    ).textContent =

        hex +

        ) +

    document.getElementById(
        "lightValue"

    document.getElementById(
        "darkValue"
    ).textContent =

    document.getElementById(

}

/* =====================================================
   РИСОВАНИЕ 8×8
===================================================== */

function drawPixelGrid() {

    pixelCtx.clearRect(
        0,
        0,
        256,
        256
    );


    const cellSize =
        32;

    const checkerSize =
        8;


    for (let y = 0; y < GRID; y++) {

        for (let x = 0; x < GRID; x++) {

            const px =
                x * cellSize;

            const py =
                y * cellSize;


            /*
               ШАХМАТНЫЙ ФОН ПРОЗРАЧНОСТИ
            */

            for (
                let cy = 0;
                cy < cellSize;
                cy += checkerSize
            ) {

                for (
                    let cx = 0;
                    cx < cellSize;
                    cx += checkerSize
                ) {

                    const even =

                        (
                            Math.floor(
                                cx / checkerSize
                            ) +

                            Math.floor(
                                cy / checkerSize
                            )
                        ) % 2 === 0;


                    pixelCtx.fillStyle =

                        even
                            ? "#252a38"
                            : "#171b27";


                    pixelCtx.fillRect(
                        px + cx,
                        py + cy,
                        checkerSize,
                        checkerSize
                    );
                }
            }


            /*
               Данные конкретного пикселя.
            */

            const color =
                pixels[y][x];


            /*
               Если пиксель существует,
               рисуем его с собственной alpha.
            */

            if (color) {

                pixelCtx.fillStyle =

                    `rgba(
                        ${color.r},
                        ${color.g},
                        ${color.b},
                        ${color.a}
                    )`;


                pixelCtx.fillRect(
                    px,
                    py,
                    cellSize,
                    cellSize
                );
            }


            /*
               Сетка.
            */

            pixelCtx.strokeStyle =
                "rgba(255,255,255,.14)";

            pixelCtx.lineWidth = 1;

            pixelCtx.strokeRect(
                px + .5,
                py + .5,
                cellSize - 1,
                cellSize - 1
            );
        }
    }
}

function saveCube() {

try {

    const cubePixels =
        pixels.map(row =>
            row.map(pixel =>
                pixel
                    ? { ...pixel }
                    : null
            )
        );

    localStorage.setItem(
        "bounceCubePixels",

} catch (error) {

    console.error(
        "Ошибка сохранения куба:",
        error
    );
}
}


/* =====================================================
ЗАГРУЗКА КУБА
===================================================== */

function loadCube() {

try {

    const saved =
        localStorage.getItem(
            "bounceCubePixels"
        );

    if (!saved)
    return;


const savedPixels =
    JSON.parse(saved);


/*
   Проверяем размер.
*/

if (
    !Array.isArray(savedPixels) ||
    savedPixels.length !== 8
) {
    return;
}


for (let y = 0; y < 8; y++) {

    if (
        !Array.isArray(savedPixels[y]) ||
        savedPixels[y].length !== 8
    ) {
        return;
    }
}


/*
   Копируем данные
   в существующий массив pixels.
*/

for (let y = 0; y < 8; y++) {

    for (let x = 0; x < 8; x++) {

        const pixel =
            savedPixels[y][x];


        if (
            !pixel ||
            typeof pixel !== "object"
        ) {

            pixels[y][x] = null;

            continue;
        }


        pixels[y][x] = {

            r: Number(pixel.r) || 0,

            g: Number(pixel.g) || 0,

            b: Number(pixel.b) || 0,

            a:
                pixel.a == null
                    ? 1
                    : Number(pixel.a)
        };
    }
}


drawPixelGrid();

console.log("Куб загружен");

} catch (error) {

console.error(
    "Ошибка загрузки куба:",
    error
);
}
}




function paintPixel(e) {

const rect =
pixelCanvas.getBoundingClientRect();


const scaleX =
256 / rect.width;

const scaleY =
256 / rect.height;


const px =
Math.floor(
    (e.clientX - rect.left) *
    scaleX /
    32
);


const py =
Math.floor(
    (e.clientY - rect.top) *
    scaleY /
    32
);


if (
px < 0 ||
px >= GRID ||
py < 0 ||
py >= GRID
)
return;


/*
ВАЖНО:
сохраняем цвет только
в выбранный пиксель.

Каждый пиксель получает
собственную alpha.
*/

pixels[py][px] =
getMixedColor();


drawPixelGrid();

saveCube();

}


pixelCanvas.addEventListener(
"mousedown",
e => {

drawing = true;

paintPixel(e);
}
);


pixelCanvas.addEventListener(
"mousemove",
e => {

if (drawing)

}

function startLevelMusic(level) {

const settings = levelMusic[level];

if (!settings)
return;

music = new Audio(settings.file);

music.preload = "auto";
music.volume = 0.7;
musicLevel = level;

// Пытаемся начать воспроизведение сразу,
// пока браузер ещё считает это действием пользователя.
music.play()
.then(() => {

    music.currentTime = settings.start;

})
.catch(err => {

    console.log(
        "Браузер заблокировал музыку:",
        err
    );
});

music.addEventListener("timeupdate", () => {

if (!music || musicLevel !== level)
    return;

if (music.currentTime >= settings.end) {

    music.currentTime = settings.start;

    music.play().catch(() => {});
}
});

document.getElementById("musicText").textContent =
"♪ Уровень " +
level +
" — " +
settings.start +
"–" +
settings.end +
" сек";
}

        blocks = createLevel2();

        blocks = createLevel3();

        blocks = createLevel5();

    document.getElementById(
        "levelText"
    ).textContent =
        "Уровень: " + level;
}


/* =====================================================
   УПРАВЛЕНИЕ: МЫШЬ + ТЕЛЕФОН
===================================================== */

function getPointerPosition(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}


function getWorldPointerPosition(e) {

    const pointer =
        getPointerPosition(e);

    return {
        x: pointer.x + camera.x,
        y: pointer.y + camera.y
    };
}


canvas.addEventListener(
    "pointerdown",
    e => {

        if (!gameScreen.classList.contains("active"))
            return;

        const pointer =
            getWorldPointerPosition(e);

        const dx =
            pointer.x - cube.x;

        const dy =
            pointer.y - cube.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        if (distance > cube.size * 1.5)
            return;

        cube.dragging = true;

        cube.startX = cube.x;
        cube.startY = cube.y;

        cube.mouseX = pointer.x;
        cube.mouseY = pointer.y;

        canvas.setPointerCapture(e.pointerId);
    }
);


canvas.addEventListener(
    "pointermove",
    e => {

        if (!cube.dragging)
            return;

        const pointer =
            getWorldPointerPosition(e);

        cube.mouseX = pointer.x;
        cube.mouseY = pointer.y;
    }
);


canvas.addEventListener(
    "pointerup",
    e => {

        if (!cube.dragging)
            return;

        const pointer =
            getWorldPointerPosition(e);

        const dx =
            cube.startX - pointer.x;

        const dy =
            cube.startY - pointer.y;

        const distance =
            Math.sqrt(
                dx * dx +
                dy * dy
            );

        const force =
            Math.min(
                MAX_FORCE,
                distance
            );

        const angle =
            Math.atan2(dy, dx);

        cube.vx =
            Math.cos(angle) *
            force *
            0.1;

        cube.vy =
            Math.sin(angle) *
            force *
            0.1;

        const speed =
            Math.sqrt(
                cube.vx * cube.vx +
                cube.vy * cube.vy
            );

        if (speed > MAX_SPEED) {

            cube.vx =
                cube.vx / speed *
                MAX_SPEED;

            cube.vy =
                cube.vy / speed *
                MAX_SPEED;
        }

        cube.dragging = false;

        syncPlayerPosition();
    }
);


canvas.addEventListener(
    "pointercancel",
    () => {

        cube.dragging = false;
    }
);

/* =====================================================
   ФИЗИКА
===================================================== */

function update() {

    // Один вызов update = один физический кадр.
    const dt = 1;

    if (cube.dragging) {

        cube.x = cube.startX;
        cube.y = cube.startY;

        cube.vx = 0;
        cube.vy = 0;

        updateCamera();
        syncPlayerPosition();

        return;
    }

    // Гравитация.
    cube.vy += cube.gravity * dt;

    // Трение.
    cube.vx *= Math.pow(
        cube.airFriction,
        dt
    );

    cube.vy *= Math.pow(
        cube.airFriction,
        dt
    );

    // Движение.
    cube.x += cube.vx * dt;
    cube.y += cube.vy * dt;

    // След куба.
    cube.trail.push({
        x: cube.x,
        y: cube.y
    });

    if (cube.trail.length > 20) {
        cube.trail.shift();
    }

    const half =
        cube.size / 2;

    // Игрок вылетел за карту.
    if (cube.y > 10000) {

        reportPlayerDeath("fall");

        resetGame();

        return;
    }

    // Столкновения с блоками.
    for (const block of blocks) {

        if (!isColliding(cube, block))
            continue;

        // Игрок влетел в шипы.
        if (block.spikes) {

            reportPlayerDeath("spikes");

            resetGame();

            return;
        }

        // Финиш.
        if (block.finish) {

            nextLevel();

            return;
        }

        const dx =
            cube.x -
            (block.x + block.w / 2);

        const dy =
            cube.y -
            (block.y + block.h / 2);

        const overlapX =
            cube.size / 2 +
            block.w / 2 -
            Math.abs(dx);

        const overlapY =
            cube.size / 2 +
            block.h / 2 -
            Math.abs(dy);

        // Вертикальное столкновение.
        if (overlapY < overlapX) {

            if (dy < 0) {

                cube.y =
                    block.y - half;

                cube.vy =
                    -Math.abs(cube.vy) *
                    block.bounce;

            } else {

                cube.y =
                    block.y +
                    block.h +
                    half;

                cube.vy =
                    Math.abs(cube.vy) *
                    block.bounce;
            }

        } else {

            // Горизонтальное столкновение.
            if (dx < 0) {

                cube.x =
                    block.x - half;

                cube.vx =
                    -Math.abs(cube.vx) *
                    block.bounce;

            } else {

                cube.x =
                    block.x +
                    block.w +
                    half;

                cube.vx =
                    Math.abs(cube.vx) *
                    block.bounce;
            }
        }
    }

    /*
       Столкновение с игроками.

       Сервер передаёт только игроков,
       находящихся на той же карте.
    */

    if (playersVisible) {

        for (const id in players) {

            if (id === socket.id)
                continue;

            const player =
                players[id];

            if (
                !player ||
                !isCollidingWithPlayer(player)
            ) {
                continue;
            }

            const otherX =
                Number(player.x);

            const otherY =
                Number(player.y);

            if (
                !Number.isFinite(otherX) ||
                !Number.isFinite(otherY)
            ) {
                continue;
            }

            const otherSize =
                Number(player.size) > 0
                    ? Number(player.size)
                    : cube.size;

            const otherVx =
                Number.isFinite(Number(player.vx))
                    ? Number(player.vx)
                    : 0;

            const otherVy =
                Number.isFinite(Number(player.vy))
                    ? Number(player.vy)
                    : 0;

            const dx =
                cube.x - otherX;

            const dy =
                cube.y - otherY;

            const halfWidth =
                (cube.size + otherSize) / 2;

            let targetVx =
                otherVx;

            let targetVy =
                otherVy;

            const overlapX =
                halfWidth - Math.abs(dx);

            const overlapY =
                halfWidth - Math.abs(dy);

            if (overlapX <= overlapY) {

                const direction =
                    dx === 0
                        ? (
                            String(socket.id)
                                .localeCompare(String(id)) < 0
                                ? -1
                                : 1
                        )
                        : Math.sign(dx);

                const averageSpeed =
                    (
                        Math.abs(cube.vx) +
                        Math.abs(otherVx)
                    ) / 2;

                cube.x =
                    otherX +
                    direction * halfWidth;

                cube.vx =
                    direction * averageSpeed;

                targetVx =
                    -direction * averageSpeed;

            } else {

                const direction =
                    dy === 0
                        ? (
                            String(socket.id)
                                .localeCompare(String(id)) < 0
                                ? -1
                                : 1
                        )
                        : Math.sign(dy);

                const averageSpeed =
                    (
                        Math.abs(cube.vy) +
                        Math.abs(otherVy)
                    ) / 2;

                cube.y =
                    otherY +
                    direction * halfWidth;

                cube.vy =
                    direction * averageSpeed;

                targetVy =
                    -direction * averageSpeed;
            }

            const now =
                performance.now();

            const lastSent =
                lastCollisionSentAt.get(id) || 0;

            if (now - lastSent >= 120) {

                lastCollisionSentAt.set(
                    id,
                    now
                );

                socket.emit(
                    "player:collision",
                    {
                        targetId: id,

                        selfVx: cube.vx,
                        selfVy: cube.vy,

                        targetVx,
                        targetVy
                    }
                );
            }
        }
    }

    updateCamera();

    syncPlayerPosition();
}


/* =====================================================
   СЛЕДУЮЩИЙ УРОВЕНЬ
===================================================== */

function nextLevel() {

    stopLevelMusic();

    backToMenu();

    return;

    selectedLevel++;

    resetGame();
}


/* =====================================================
   КАМЕРА
===================================================== */

function updateCamera() {

    const targetX =
        cube.x -
        canvas.width / 2;

    const targetY =
        cube.y -
        canvas.height / 2;


    camera.x +=
        (
            targetX -
            camera.x
        ) * camera.smoothness;

    camera.y +=
        (
            targetY -
            camera.y
        ) * camera.smoothness;
}


/* =====================================================
   ПРОВЕРКА СТОЛКНОВЕНИЙ С БЛОКАМИ
===================================================== */

function isColliding(a, b) {

    return (
        a.x + a.size / 2 > b.x &&
        a.x - a.size / 2 < b.x + b.w &&
        a.y + a.size / 2 > b.y &&
        a.y - a.size / 2 < b.y + b.h
    );
}


/* =====================================================
   ПРОВЕРКА СТОЛКНОВЕНИЯ С ИГРОКОМ
===================================================== */

function isCollidingWithPlayer(player) {

    if (!player)
        return false;

    const halfCube =
        cube.size / 2;

    const playerSize =
        Number(player.size) > 0
            ? Number(player.size)
            : cube.size;

    const halfPlayer =
        playerSize / 2;

    return (
        cube.x + halfCube >
            player.x - halfPlayer &&

        cube.x - halfCube <
            player.x + halfPlayer &&

        cube.y + halfCube >
            player.y - halfPlayer &&

        cube.y - halfCube <
            player.y + halfPlayer
    );
}


/* =====================================================
   RESET
===================================================== */

function resetGame() {

    cube.x = 200;
    cube.y = 250;

    cube.vx = 0;
    cube.vy = 0;

    cube.dragging = false;
    cube.trail = [];

    camera.x = 0;
    camera.y = 0;

    if (blocks.length === 0) {
        loadLevel(selectedLevel);
    }

    document.getElementById(
        "levelText"
    ).textContent =
        "Уровень: " + selectedLevel;

    syncPlayerPosition();
}


/* =====================================================
   GAME LOOP
===================================================== */

function gameLoop(currentTime) {

    requestAnimationFrame(gameLoop);

    if (
        !gameScreen.classList.contains("active")
    ) {
        lastTime = currentTime;
        return;
    }

    let frameTime =
        (currentTime - lastTime) / 1000;

    lastTime = currentTime;

    frameTime =
        Math.min(frameTime, 0.1);

    accumulator += frameTime;

    while (accumulator >= FIXED_DT) {

        update();

        accumulator -= FIXED_DT;
    }

    ctx.save();

    ctx.translate(
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.scale(
        camera.zoom,
        camera.zoom
    );

    ctx.translate(
        -canvas.width / 2,
        -canvas.height / 2
    );

    ctx.restore();
}

requestAnimationFrame(gameLoop);

loadCube();

</script>
