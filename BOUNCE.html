<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>BOUNCE</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    font-family: Arial, sans-serif;
    background: #10131c;
    color: white;
}

button, input {
    font: inherit;
}

.screen {
    position: fixed;
    inset: 0;
    display: none;
}

.screen.active {
    display: flex;
}

/* =====================================================
   ГЛАВНОЕ МЕНЮ
===================================================== */

#menu {
    align-items: center;
    justify-content: center;
    background:
        radial-gradient(
            circle at 50% 35%,
            #242b42 0%,
            #151927 40%,
            #0c0f17 100%
        );
}

.menu-box {
    width: min(1100px, 94vw);
    max-height: 94vh;
    overflow-y: auto;
    padding: 30px;
    border: 1px solid rgba(255,255,255,.1);
    border-radius: 24px;
    background: rgba(14,18,30,.94);
    box-shadow: 0 25px 80px rgba(0,0,0,.5);
}

.logo {
    text-align: center;
    margin-bottom: 25px;
}

.logo h1 {
    margin: 0;
    font-size: 48px;
    letter-spacing: 8px;
}

.logo p {
    margin: 8px 0 0;
    color: #8993ad;
}

.editor {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 25px;
}

.panel {
    padding: 20px;
    border-radius: 18px;
    background: #191e2d;
    border: 1px solid rgba(255,255,255,.06);
}

.panel h2 {
    margin: 0 0 18px;
    font-size: 19px;
}

.colors {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
}

.color-input {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 12px;
    border-radius: 12px;
    background: #111522;
}

.color-input input[type="color"] {
    width: 48px;
    height: 42px;
    padding: 2px;
    border: none;
    background: transparent;
    cursor: pointer;
}

.color-input span {
    font-size: 13px;
    color: #aeb7cc;
}

.slider {
    margin-top: 18px;
}

.slider-title {
    display: flex;
    justify-content: space-between;
    margin-bottom: 8px;
    font-size: 13px;
    color: #b8c0d2;
}

.slider-value {
    color: white;
    font-weight: bold;
}

input[type="range"] {
    width: 100%;
    accent-color: #6675ff;
    cursor: pointer;
}

/* =====================================================
   ПРЕДПРОСМОТР КУБА
===================================================== */

.cube-editor {
    display: flex;
    gap: 22px;
    align-items: flex-start;
}

.pixel-wrap {
    width: 320px;
    height: 320px;
    flex-shrink: 0;
    padding: 20px;
    border-radius: 16px;
    background: #0d1019;
    display: flex;
    align-items: center;
    justify-content: center;
}

#pixelCanvas {
    width: 256px;
    height: 256px;
    image-rendering: pixelated;
    image-rendering: crisp-edges;
    border: 3px solid #394057;
    cursor: crosshair;
}

.pixel-tools {
    flex: 1;
}

.current-color {
    height: 70px;
    border-radius: 12px;
    margin-bottom: 15px;
    border: 2px solid rgba(255,255,255,.15);
    display: flex;
    align-items: center;
    justify-content: center;
    font-weight: bold;
    text-shadow: 0 1px 3px #000;
}

.tool-row {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
}

.small-btn,
.main-btn {
    border: none;
    border-radius: 10px;
    color: white;
    cursor: pointer;
    transition: .15s;
}

.small-btn {
    padding: 9px 13px;
    background: #292f43;
}

.small-btn:hover {
    background: #353d56;
}

.main-btn {
    display: block;
    width: 100%;
    margin-top: 25px;
    padding: 16px;
    font-size: 18px;
    font-weight: bold;
    background: linear-gradient(135deg,#5865f2,#7b61ff);
    box-shadow: 0 10px 30px rgba(88,101,242,.25);
}

.main-btn:hover {
    transform: translateY(-2px);
    filter: brightness(1.1);
}

/* =====================================================
   УРОВНИ
===================================================== */

.level-panel {
    margin-top: 25px;
}

.levels {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 10px;
}

.level-btn {
    padding: 14px 8px;
    border: 2px solid #30374d;
    border-radius: 12px;
    background: #111522;
    color: white;
    cursor: pointer;
    transition: .15s;
}

.level-btn:hover {
    background: #252c40;
}

.level-btn.selected {
    border-color: #6675ff;
    background: #30375c;
    box-shadow: 0 0 20px rgba(102,117,255,.25);
}

.level-number {
    display: block;
    font-size: 20px;
    font-weight: bold;
}

.level-name {
    display: block;
    margin-top: 5px;
    font-size: 11px;
    color: #9da7bf;
}

.hint {
    margin-top: 15px;
    color: #707a91;
    font-size: 12px;
    line-height: 1.5;
}

/* =====================================================
   ИГРА
===================================================== */

#gameScreen {
    background: #10131c;
}

#game {
    position: absolute;
    inset: 0;
    display: block;
    cursor: crosshair;
}

.game-ui {
    position: fixed;
    top: 15px;
    left: 15px;
    z-index: 10;
    padding: 14px 16px;
    color: white;
    background: rgba(15,18,30,.9);
    border: 1px solid rgba(255,255,255,.08);
    border-radius: 12px;
    user-select: none;
}

.game-ui p {
    margin: 5px 0;
    color: #aeb7cc;
    font-size: 13px;
}

.game-buttons {
    display: flex;
    gap: 7px;
    margin-top: 9px;
}

.game-buttons button {
    padding: 7px 11px;
    border: none;
    border-radius: 7px;
    background: #5865f2;
    color: white;
    cursor: pointer;
}

.game-buttons button:hover {
    background: #6975ff;
}

#forceText {
    color: white;
    font-weight: bold;
}

#levelText {
    color: #ffffff;
    font-weight: bold;
}

#musicText {
    color: #7fe7ff;
    font-size: 12px;
}

/* =====================================================
   АДАПТИВ
===================================================== */

@media (max-width: 800px) {

    .editor {
        grid-template-columns: 1fr;
    }

    .cube-editor {
        flex-direction: column;
    }

    .pixel-wrap {
        width: 100%;
    }

    .logo h1 {
        font-size: 35px;
    }

    .levels {
        grid-template-columns: repeat(5, 1fr);
    }

    .level-name {
        display: none;
    }
}

/* =====================================================
   МОБИЛЬНОЕ УПРАВЛЕНИЕ
===================================================== */

#game {
    touch-action: none;
    -webkit-user-select: none;
    user-select: none;
}

@media (max-width: 800px) {

    .game-ui {
        top: 10px;
        left: 10px;
        padding: 10px 12px;
        font-size: 12px;
    }

    .game-ui p {
        margin: 3px 0;
        font-size: 11px;
    }

    .game-buttons button {
        padding: 8px 10px;
    }

    .menu-box {
        padding: 18px;
    }

    .panel {
        padding: 15px;
    }

    .colors {
        grid-template-columns: 1fr;
    }

    .pixel-wrap {
        height: auto;
        aspect-ratio: 1;
    }

    #pixelCanvas {
        width: min(256px, 100%);
        height: auto;
        aspect-ratio: 1;
    }
}

/* =====================================================
   АВТОРИЗАЦИЯ
===================================================== */

.auth-panel {
    margin-bottom: 25px;
    padding: 16px;
    border-radius: 16px;
    background: #111522;
    border: 1px solid rgba(255,255,255,.06);
}

.auth-status {
    text-align: center;
    margin-bottom: 12px;
    color: #9da7bf;
    font-size: 14px;
}

.auth-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
}

.auth-btn {
    border: none;
    border-radius: 10px;
    padding: 11px 18px;
    background: #292f43;
    color: white;
    cursor: pointer;
    transition: .15s;
    font-weight: bold;
}

.auth-btn:hover {
    background: #5865f2;
    transform: translateY(-1px);
}

.logout-btn {
    display: block;
    width: 100%;
    background: #3a2028;
}

.logout-btn:hover {
    background: #d6455d;
}

.auth-modal {
    position: fixed;
    inset: 0;
    z-index: 1000;

    display: none;

    align-items: center;
    justify-content: center;

    background: rgba(0,0,0,.65);

    backdrop-filter: blur(8px);
}

.auth-modal.active {
    display: flex;
}

.auth-window {
    position: relative;

    width: min(400px, 90vw);

    padding: 28px;

    border-radius: 20px;

    background: #191e2d;

    border: 1px solid rgba(255,255,255,.08);

    box-shadow:
        0 30px 80px rgba(0,0,0,.6);
}

.auth-window h2 {
    margin: 0 0 20px;

    text-align: center;
}

.auth-window input {
    width: 100%;

    margin-bottom: 12px;

    padding: 13px 15px;

    border: 1px solid #30374d;
    border-radius: 10px;

    outline: none;

    background: #111522;
    color: white;
}

.auth-window input:focus {
    border-color: #6675ff;
}

.auth-close {
    position: absolute;

    top: 10px;
    right: 12px;

    border: none;

    background: none;

    color: #8e98b0;

    font-size: 28px;

    cursor: pointer;
}

.auth-submit {
    width: 100%;

    padding: 13px;

    border: none;
    border-radius: 10px;

    background:
        linear-gradient(
            135deg,
            #5865f2,
            #7b61ff
        );

    color: white;

    font-weight: bold;

    cursor: pointer;
}

.auth-error {
    min-height: 20px;

    margin-top: 12px;

    text-align: center;

    color: #ff657d;

    font-size: 13px;
}



</style>
</head>

<body>

<!-- =====================================================
     ГЛАВНОЕ МЕНЮ
===================================================== -->

<section id="menu" class="screen active">

    <div class="menu-box">

        <div class="logo">
            <h1>BOUNCE</h1>
        </div>

        <div class="editor">

            <!-- ЦВЕТА -->

            <div class="panel">

                <h2>Настройка цветов</h2>

                <div class="colors">

                    <label class="color-input">
                        <input
                            type="color"
                            id="color1"
                            value="#ff0000"
                        >
                        <span>Главный цвет</span>
                    </label>

                    <label class="color-input">
                        <input
                            type="color"
                            id="color2"
                            value="#ffff00"
                        >
                        <span>Детальный цвет</span>
                    </label>

                </div>

                <!-- СМЕШИВАНИЕ -->

                <div class="slider">

                    <div class="slider-title">
                        <span>Смешивание</span>
                        <span
                            class="slider-value"
                            id="mixValue"
                        >
                            0%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="mix"
                        min="0"
                        max="100"
                        value="0"
                    >

                </div>

                <!-- БЛЕДНОСТЬ -->

                <div class="slider">

                    <div class="slider-title">
                        <span>Бледность</span>
                        <span
                            class="slider-value"
                            id="lightValue"
                        >
                            0%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="light"
                        min="0"
                        max="100"
                        value="0"
                    >

                </div>

                <!-- ТЬМА -->

                <div class="slider">

                    <div class="slider-title">
                        <span>Тьма</span>
                        <span
                            class="slider-value"
                            id="darkValue"
                        >
                            0%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="dark"
                        min="0"
                        max="100"
                        value="0"
                    >

                </div>

                <!-- ПРОЗРАЧНОСТЬ -->

                <div class="slider">

                    <div class="slider-title">
                        <span>Прозрачность</span>

                        <span
                            class="slider-value"
                            id="opacityValue"
                        >
                            100%
                        </span>
                    </div>

                    <input
                        type="range"
                        id="opacity"
                        min="0"
                        max="100"
                        value="100"
                    >

                </div>

                <div
                    class="current-color"
                    id="colorPreview"
                >
                    #FF7A1A
                </div>

            </div>


            <!-- ПИКСЕЛЬНЫЙ КУБ -->

            <div class="panel">

                <h2>Your cube</h2>

                <div class="cube-editor">

                    <div class="pixel-wrap">

                        <canvas
                            id="pixelCanvas"
                            width="256"
                            height="256"
                        ></canvas>

                    </div>

                    <div class="pixel-tools">

                        <div class="tool-row">

                            <button
                                class="small-btn"
                                id="fillBtn"
                            >
                                Заполнить цветом
                            </button>

                            <button
                                class="small-btn"
                                id="clearBtn"
                            >
                                Очистить
                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>


        <!-- УРОВНИ -->

        <div class="panel level-panel">

            <h2>Levels</h2>

            <div class="levels">

                <button
                    class="level-btn selected"
                    data-level="1"
                >
                    <span class="level-number">1</span>
                    <span class="level-name">Tendo</span>
                </button>

                <button
                    class="level-btn"
                    data-level="2"
                >
                    <span class="level-number">2</span>
                    <span class="level-name">Infiltration</span>
                </button>

                <button
                    class="level-btn"
                    data-level="3"
                >
                    <span class="level-number">3</span>
                    <span class="level-name">Freaks</span>
                </button>

                <button
                    class="level-btn"
                    data-level="4"
                >
                    <span class="level-number">4</span>
                    <span class="level-name">The Ghost</span>
                </button>

                <button
                    class="level-btn"
                    data-level="5"
                >
                    <span class="level-number">5</span>
                    <span class="level-name">Into Pieces</span>
                </button>

            </div>

        </div>


        <button
            class="main-btn"
            id="startButton"
        >
            ▶ START
        </button>

    </div>

    <div class="auth-panel">

        <div id="authStatus" class="auth-status">
            Не авторизован
        </div>

        <div id="authButtons" class="auth-buttons">
            <button class="auth-btn" id="createAccountButton">
                Create account
            </button>

            <button class="auth-btn" id="loginButton">
                Login
            </button>
        </div>

        <button
            class="auth-btn logout-btn"
            id="logoutButton"
            style="display:none;"
        >
            Logout
        </button>

    </div>

    <div id="authModal" class="auth-modal">

        <div class="auth-window">

            <button
                class="auth-close"
                id="authClose"
            >
                ×
            </button>

            <h2 id="authTitle">
                Login
            </h2>

            <input
                id="authUsername"
                type="text"
                placeholder="Username"
                autocomplete="username"
                maxlength="20"
            >

            <input
                id="authPassword"
                type="password"
                placeholder="Password"
                autocomplete="current-password"
                maxlength="100"
            >

            <button
                id="authSubmit"
                class="auth-submit"
            >
                Login
            </button>

            <div
                id="authError"
                class="auth-error"
            ></div>

        </div>

    </div>



</section>


<!-- =====================================================
     ИГРА
===================================================== -->

<section id="gameScreen" class="screen">

    <canvas id="game"></canvas>

    <div class="game-ui">

        <p id="levelText">
            Уровень: 1
        </p>

        <p id="musicText">
            ♪ Музыка
        </p>

        <p
            id="forceText"
            style="display: none;"
        >
            Сила: 0 / 200
        </p>

        <div class="game-buttons">

            <button onclick="resetGame()">
                Restart
            </button>

            <button onclick="backToMenu()">
                Menu
            </button>

        </div>

    </div>

</section>

<script src="/socket.io/socket.io.js"></script>

<script>

const socket = io();

socket.on("connect_error", error => {
    console.log("Socket auth error:", error.message);
});

socket.on("auth:success", user => {
    console.log("Socket авторизован:", user.username);

    updateAuthUI(user);

    if (user.cubePixels) {
        loadSavedCube(user.cubePixels);
    }

    if (
        Number.isInteger(user.level) &&
        user.level >= 1 &&
        user.level <= 5
    ) {
        selectedLevel = user.level;

        document
            .querySelectorAll(".level-btn")
            .forEach(button => {
                button.classList.toggle(
                    "selected",
                    Number(button.dataset.level) === selectedLevel
                );
            });
    }
});


/* =====================================================
   PIXEL EDITOR
===================================================== */

const pixelCanvas =
    document.getElementById("pixelCanvas");

const pixelCtx =
    pixelCanvas.getContext("2d");

const GRID = 8;

const pixels = [];

for (let y = 0; y < GRID; y++) {

    pixels[y] = [];

    for (let x = 0; x < GRID; x++) {

        pixels[y][x] = null;
    }
}

let drawing = false;


/* =====================================================
   ЦВЕТА
===================================================== */

const color1 =
    document.getElementById("color1");

const color2 =
    document.getElementById("color2");

const mix =
    document.getElementById("mix");

const light =
    document.getElementById("light");

const dark =
    document.getElementById("dark");

const opacity =
    document.getElementById("opacity");


function hexToRgb(hex) {

    hex = hex.replace("#","");

    return {

        r: parseInt(
            hex.substring(0,2),
            16
        ),

        g: parseInt(
            hex.substring(2,4),
            16
        ),

        b: parseInt(
            hex.substring(4,6),
            16
        )
    };
}


function rgbToHex(r,g,b) {

    return "#" +

        [r,g,b]

        .map(v =>
            Math.round(v)
                .toString(16)
                .padStart(2,"0")
        )

        .join("")
        .toUpperCase();
}


/*
   Теперь цвет хранится как RGBA-объект.

   Например:

   {
       r: 255,
       g: 0,
       b: 0,
       a: 0.5
   }

   Благодаря этому прозрачность сохраняется
   отдельно для каждого пикселя.
*/

function getMixedColor() {

    const a =
        hexToRgb(color1.value);

    const b =
        hexToRgb(color2.value);

    const m =
        Number(mix.value) / 100;

    let r =
        a.r * (1-m) +
        b.r * m;

    let g =
        a.g * (1-m) +
        b.g * m;

    let bl =
        a.b * (1-m) +
        b.b * m;


    const l =
        Number(light.value) / 100;

    r += (255-r) * l;
    g += (255-g) * l;
    bl += (255-bl) * l;


    const d =
        Number(dark.value) / 100;

    r *= 1-d;
    g *= 1-d;
    bl *= 1-d;


    return {

        r: Math.round(r),

        g: Math.round(g),

        b: Math.round(bl),

        a: Number(opacity.value) / 100

    };
}


/*
   HEX нужен только для отображения
   текущего выбранного цвета.
*/

function getMixedHex() {

    const color =
        getMixedColor();

    return rgbToHex(
        color.r,
        color.g,
        color.b
    );
}


function updateColor() {

    const color =
        getMixedColor();

    const hex =
        rgbToHex(
            color.r,
            color.g,
            color.b
        );


    document.getElementById(
        "colorPreview"
    ).style.background =

        `rgba(
            ${color.r},
            ${color.g},
            ${color.b},
            ${color.a}
        )`;


    document.getElementById(
        "colorPreview"
    ).textContent =

        hex +
        "  " +
        Math.round(
            color.a * 100
        ) +
        "%";


    document.getElementById(
        "mixValue"
    ).textContent =
        mix.value + "%";


    document.getElementById(
        "lightValue"
    ).textContent =
        light.value + "%";


    document.getElementById(
        "darkValue"
    ).textContent =
        dark.value + "%";


    document.getElementById(
        "opacityValue"
    ).textContent =
        opacity.value + "%";
}


[
    color1,
    color2,
    mix,
    light,
    dark,
    opacity
]
.forEach(element => {

    element.addEventListener(
        "input",
        updateColor
    );

});


updateColor();


/* =====================================================
   РИСОВАНИЕ 8×8
===================================================== */

function drawPixelGrid() {

    pixelCtx.clearRect(
        0,
        0,
        256,
        256
    );


    const cellSize =
        32;

    const checkerSize =
        8;


    for (let y = 0; y < GRID; y++) {

        for (let x = 0; x < GRID; x++) {

            const px =
                x * cellSize;

            const py =
                y * cellSize;


            /*
               ШАХМАТНЫЙ ФОН ПРОЗРАЧНОСТИ
            */

            for (
                let cy = 0;
                cy < cellSize;
                cy += checkerSize
            ) {

                for (
                    let cx = 0;
                    cx < cellSize;
                    cx += checkerSize
                ) {

                    const even =

                        (
                            Math.floor(
                                cx / checkerSize
                            ) +

                            Math.floor(
                                cy / checkerSize
                            )
                        ) % 2 === 0;


                    pixelCtx.fillStyle =

                        even
                            ? "#252a38"
                            : "#171b27";


                    pixelCtx.fillRect(
                        px + cx,
                        py + cy,
                        checkerSize,
                        checkerSize
                    );
                }
            }


            /*
               Данные конкретного пикселя.
            */

            const color =
                pixels[y][x];


            /*
               Если пиксель существует,
               рисуем его с собственной alpha.
            */

            if (color) {

                pixelCtx.fillStyle =

                    `rgba(
                        ${color.r},
                        ${color.g},
                        ${color.b},
                        ${color.a}
                    )`;


                pixelCtx.fillRect(
                    px,
                    py,
                    cellSize,
                    cellSize
                );
            }


            /*
               Сетка.
            */

            pixelCtx.strokeStyle =
                "rgba(255,255,255,.14)";

            pixelCtx.lineWidth = 1;

            pixelCtx.strokeRect(
                px + .5,
                py + .5,
                cellSize - 1,
                cellSize - 1
            );
        }
    }
}


function paintPixel(e) {

    const rect =
        pixelCanvas.getBoundingClientRect();


    const scaleX =
        256 / rect.width;

    const scaleY =
        256 / rect.height;


    const px =
        Math.floor(
            (e.clientX - rect.left) *
            scaleX /
            32
        );


    const py =
        Math.floor(
            (e.clientY - rect.top) *
            scaleY /
            32
        );


    if (
        px < 0 ||
        px >= GRID ||
        py < 0 ||
        py >= GRID
    )
        return;


    /*
       ВАЖНО:
       сохраняем цвет только
       в выбранный пиксель.

       Каждый пиксель получает
       собственную alpha.
    */

    pixels[py][px] =
        getMixedColor();


    drawPixelGrid();
}


pixelCanvas.addEventListener(
    "mousedown",
    e => {

        drawing = true;

        paintPixel(e);
    }
);


pixelCanvas.addEventListener(
    "mousemove",
    e => {

        if (drawing)
            paintPixel(e);
    }
);


window.addEventListener(
    "mouseup",
    () => {

        drawing = false;
    }
);

function startLevelMusic(level) {

    stopLevelMusic();

    const settings = levelMusic[level];

    if (!settings)
        return;

    music = new Audio(settings.file);

    music.preload = "auto";
    music.volume = 0.7;
    musicLevel = level;

    // Пытаемся начать воспроизведение сразу,
    // пока браузер ещё считает это действием пользователя.
    music.play()
        .then(() => {

            music.currentTime = settings.start;

        })
        .catch(err => {

            console.log(
                "Браузер заблокировал музыку:",
                err
            );
        });

    music.addEventListener("timeupdate", () => {

        if (!music || musicLevel !== level)
            return;

        if (music.currentTime >= settings.end) {

            music.currentTime = settings.start;

            music.play().catch(() => {});
        }
    });

    document.getElementById("musicText").textContent =
        "♪ Уровень " +
        level +
        " — " +
        settings.start +
        "–" +
        settings.end +
        " сек";
}

}

        "Уровень: " + level;

===================================================== */

function getPointerPosition(e) {

    const rect =
        canvas.getBoundingClientRect();

    return {
        x: e.clientX - rect.left,
        y: e.clientY - rect.top
    };
}


function getWorldPointerPosition(e) {

    const pointer =
        getPointerPosition(e);

    return {
        x: pointer.x + camera.x,
        y: pointer.y + camera.y
    };
}

        cube.size / 2;

    for (const block of blocks) {

            continue;

        const horizontal =
            cube.x + half > block.x &&
            cube.x - half <
                block.x + block.w;

        const onTop =
            Math.abs(
                (cube.y + half) -
                block.y
            ) <= 8;

        if (
            horizontal &&
            onTop
        ) {
            return true;
        }
    }

    return false;
}


/*
   Начало перетаскивания.
*/

function startDrag(e) {

    if (cube.dragging)
        return;

    /*
       На мобильном предотвращаем
       прокрутку/жесты браузера.
    */

    if (e.cancelable)
        e.preventDefault();


    const world =
        getWorldPointerPosition(e);


    const dx =
        world.x - cube.x;

    const dy =
        world.y - cube.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
       Куб можно взять только тогда,
       когда он стоит на блоке.
    */

    if (!isCubeOnBlock())
        return;


    /*
       Палец/мышь должен находиться
       рядом с кубом.
    */

    if (distance > cube.size * 1.4)
        return;


    cube.dragging = true;

    cube.vx = 0;
    cube.vy = 0;


    cube.startX =
        cube.x;

    cube.startY =
        cube.y;


    cube.mouseX =
        e.clientX;

    cube.mouseY =
        e.clientY;


    cube.trail = [];


    /*
       Для touch/Pointer Events
       захватываем указатель.
    */

    if (
        e.pointerId !== undefined &&
        canvas.setPointerCapture
    ) {

        try {
            canvas.setPointerCapture(
                e.pointerId
            );
        } catch (err) {}
    }
}


/*
   Движение пальца/мыши.
*/

function moveDrag(e) {

    if (!cube.dragging)
        return;

    if (e.cancelable)
        e.preventDefault();


    cube.mouseX =
        e.clientX;

    cube.mouseY =
        e.clientY;
}


/*
   Отпускание пальца/мыши.
*/

function endDrag(e) {

    if (!cube.dragging)
        return;

    if (e.cancelable)
        e.preventDefault();


    cube.dragging = false;


    const world =
        getWorldPointerPosition(e);


    const dx =
        cube.startX -
        world.x;

    const dy =
        cube.startY -
        world.y;


    const distance =
        Math.sqrt(
            dx * dx +
            dy * dy
        );


    /*
       Если почти не потянули —
       куб не запускается.
    */

    if (distance < 5) {

        cube.vx = 0;
        cube.vy = 0;

        return;
    }


    const force =
        Math.min(
            distance /
            MAX_PULL *
            MAX_FORCE,

            MAX_FORCE
        );


    const nx =
        dx / distance;

    const ny =
        dy / distance;


    const speed =
        force /
        MAX_FORCE *
        MAX_SPEED;


    cube.vx =
        nx * speed;

    cube.vy =
        ny * speed;
}


/*
   Pointer Events работают и для:

*/

function isColliding(c,b) {

    const half =
        c.size / 2;

    return (

        c.x + half > b.x &&

        c.x - half <
            b.x + b.w &&

        c.y + half > b.y &&

        c.y - half <
            b.y + b.h
    );
}


function normalizeUsername(username) {

function isValidUsername(username) {
    return (
        typeof username === "string" &&
        username.length > 0
    );
}


function isValidPassword(password) {
    return (
        typeof password === "string" &&
        password.length > 0
    );
}


function loadSavedCube(savedPixels) {

    if (!Array.isArray(savedPixels))
        return;

    if (savedPixels.length !== 8)
        return;

    for (let y = 0; y < 8; y++) {

        if (!Array.isArray(savedPixels[y]))
            return;

        if (savedPixels[y].length !== 8)
            return;
    }

    for (let y = 0; y < 8; y++) {

        for (let x = 0; x < 8; x++) {

            const color = savedPixels[y][x];

            if (!color) {

                pixels[y][x] = null;

                continue;
            }

            pixels[y][x] = {

                r: Number(color.r),
                g: Number(color.g),
                b: Number(color.b),
                a: Number(color.a)
            };
        }
    }

    drawPixelGrid();
}

/* =====================================================
   ФИЗИКА
===================================================== */

function update() {

    // Один вызов update = ровно один физический кадр 60 FPS
    const dt = 1;

    if (cube.dragging) {

        cube.x = cube.startX;
        cube.y = cube.startY;

        updateCamera();

        return;
    }

    // Гравитация
    cube.vy += cube.gravity * dt;

    // Трение
    cube.vx *= Math.pow(cube.airFriction, dt);
    cube.vy *= Math.pow(cube.airFriction, dt);

    // Движение
    cube.x += cube.vx * dt;
    cube.y += cube.vy * dt;

    // След
    cube.trail.push({
        x: cube.x,
        y: cube.y
    });

    if (cube.trail.length > 20) {
        cube.trail.shift();
    }

    const half = cube.size / 2;

    // Защита от огромного падения
    if (cube.y > 10000) {
        resetGame();
        return;
    }

    // Столкновения
    for (const block of blocks) {

        if (!isColliding(cube, block))
            continue;

        // Шипы
        if (block.spikes) {
            resetGame();
            return;
        }

        // Финиш
        if (block.finish) {
            nextLevel();
            return;
        }

        const dx =
            cube.x -
            (block.x + block.w / 2);

        const dy =
            cube.y -
            (block.y + block.h / 2);

        const overlapX =
            cube.size / 2 +
            block.w / 2 -
            Math.abs(dx);

        const overlapY =
            cube.size / 2 +
            block.h / 2 -
            Math.abs(dy);

        // Вертикальное столкновение
        if (overlapY < overlapX) {

            if (dy < 0) {

                cube.y =
                    block.y - half;

                cube.vy =
                    -Math.abs(cube.vy) *
                    block.bounce;

            } else {

                cube.y =
                    block.y +
                    block.h +
                    half;

                cube.vy =
                    Math.abs(cube.vy) *
                    block.bounce;
            }

        // Горизонтальное столкновение
        } else {

            if (dx < 0) {

                cube.x =
                    block.x - half;

                cube.vx =
                    -Math.abs(cube.vx) *
                    block.bounce;

            } else {

                cube.x =
                    block.x +
                    block.w +
                    half;

                cube.vx =
                    Math.abs(cube.vx) *
                    block.bounce;
            }
        }
    }

    updateCamera();
}

/* =====================================================
   КАМЕРА
===================================================== */

function updateCamera() {

    const targetX =
        cube.x -
        canvas.width / 2;

    const targetY =
        cube.y -
        canvas.height / 2;


    camera.x +=
        (
            targetX -
            camera.x
        ) *
        camera.smoothness;


    camera.y +=
        (
            targetY -
            camera.y
        ) *
        camera.smoothness;
}

===================================================== */

function drawBackground() {

        0,

        canvas.width,

    );
}


/* =====================================================
   БЛОКИ
===================================================== */

function drawBlocks() {

    for (const block of blocks) {

        const x =
            block.x -
            camera.x;

        const y =
            block.y -
            camera.y;


        /*
           ШИПЫ
        */

        if (block.spikes) {

            const spikeSize = 10;

            const spikeWidth = 30;


            /*
               Основа.
            */

            ctx.fillStyle =
                block.color;

            ctx.shadowBlur = 15;

            ctx.shadowColor =
                block.color;


            ctx.fillRect(
                x,
                y,
                block.w,
                block.h
            );


            ctx.shadowBlur = 0;


            /*
               Сверху и снизу.
            */

            for (
                let sx = x;
                sx < x + block.w;
                sx += spikeWidth
            ) {

                const w =
                    Math.min(
                        spikeWidth,
                        x + block.w - sx
                    );


                /*
                   Верхний.
                */

                ctx.beginPath();

                ctx.moveTo(
                    sx,
                    y
                );

                ctx.lineTo(
                    sx + w / 2,
                    y - spikeSize
                );

                ctx.lineTo(
                    sx + w,
                    y
                );

                ctx.closePath();

                ctx.fill();


                /*
                   Нижний.
                */

                ctx.beginPath();

                ctx.moveTo(
                    sx,
                    y + block.h
                );

                ctx.lineTo(
                    sx + w / 2,
                    y + block.h +
                    spikeSize
                );

                ctx.lineTo(
                    sx + w,
                    y + block.h
                );

                ctx.closePath();

                ctx.fill();
            }


            /*
               Слева и справа.
            */

            for (
                let sy = y;
                sy < y + block.h;
                sy += spikeWidth
            ) {

                const h =
                    Math.min(
                        spikeWidth,
                        y + block.h - sy
                    );


                /*
                   Левый.
                */

                ctx.beginPath();

                ctx.moveTo(
                    x,
                    sy
                );

                ctx.lineTo(
                    x - spikeSize,
                    sy + h / 2
                );

                ctx.lineTo(
                    x,
                    sy + h
                );

                ctx.closePath();

                ctx.fill();


                /*
                   Правый.
                */

                ctx.beginPath();

                ctx.moveTo(
                    x + block.w,
                    sy
                );

                ctx.lineTo(
                    x + block.w +
                    spikeSize,
                    sy + h / 2
                );

                ctx.lineTo(
                    x + block.w,
                    sy + h
                );

                ctx.closePath();

                ctx.fill();
            }


            continue;
        }


        /*
           ФИНИШ.
        */

        if (block.finish) {

            ctx.shadowBlur = 25;

            ctx.shadowColor =
                block.color;

            ctx.fillStyle =
                block.color;


            ctx.beginPath();

            ctx.roundRect(
                x,
                y,
                block.w,
                block.h,
                8
            );

            ctx.fill();


            ctx.shadowBlur = 0;

            continue;
        }


        /*
           Обычный блок.
        */

        ctx.shadowBlur = 20;

        ctx.shadowColor =
            block.color;

        ctx.fillStyle =
            block.color;


        ctx.beginPath();

        ctx.roundRect(
            x,
            y,
            block.w,
            block.h,
            8
        );

        ctx.fill();


        ctx.shadowBlur = 0;
    }
}


/* =====================================================
   СТРЕЛКА
===================================================== */

function drawAim() {

    if (!cube.dragging)
        return;


    const worldMouseX =
        cube.mouseX +
        camera.x;

    const worldMouseY =
        cube.mouseY +
        camera.y;


    const dx =
        cube.startX -
        worldMouseX;

    const dy =
        cube.startY -
        worldMouseY;


    const distance =
        Math.sqrt(
            dx*dx +
            dy*dy
        );


    if (distance < 2)
        return;


    const force =
        Math.min(
            distance /
            MAX_PULL *
            MAX_FORCE,
            MAX_FORCE
        );


    const nx =
        dx / distance;

    const ny =
        dy / distance;


    const length =
        Math.min(
            distance,
            230
        );


    const sx =
        cube.startX -
        camera.x;

    const sy =
        cube.startY -
        camera.y;


    const ex =
        sx + nx * length;

    const ey =
        sy + ny * length;


    let color;

    if (force < 70)
        color = "#00ff66";

    else if (force < 140)
        color = "#ffe600";

    else
        color = "#ff453a";


    ctx.strokeStyle =
        color;

    ctx.lineWidth = 5;

    ctx.lineCap =
        "round";


    ctx.beginPath();

    ctx.moveTo(
        sx,
        sy
    );

    ctx.lineTo(
        ex,
        ey
    );

    ctx.stroke();


    ctx.fillStyle =
        color;


    for (
        let i = 30;
        i < length;
        i += 30
    ) {

        ctx.beginPath();

        ctx.arc(
            sx + nx*i,
            sy + ny*i,
            3,
            0,
            Math.PI*2
        );

        ctx.fill();
    }


    const arrowSize = 17;

    const sideX = -ny;

    const sideY = nx;


    ctx.beginPath();

    ctx.moveTo(
        ex,
        ey
    );

    ctx.lineTo(
        ex -
        nx*arrowSize +
        sideX*10,

        ey -
        ny*arrowSize +
        sideY*10
    );

    ctx.lineTo(
        ex -
        nx*arrowSize -
        sideX*10,

        ey -
        ny*arrowSize -
        sideY*10
    );

    ctx.closePath();

    ctx.fill();


    ctx.font =
        "bold 16px Arial";

    ctx.textAlign =
        "center";

    ctx.fillStyle =
        "white";


    ctx.fillText(
        "СИЛА: " +
        Math.round(force) +
        " / 200",

        sx,
        sy - 50
    );


    const barWidth = 120;

    const barHeight = 8;

    const barX =
        sx -
        barWidth/2;

    const barY =
        sy -
        35;


    ctx.fillStyle =
        "rgba(255,255,255,.15)";


    ctx.beginPath();

    ctx.roundRect(
        barX,
        barY,
        barWidth,
        barHeight,
        4
    );

    ctx.fill();


    ctx.fillStyle =
        color;


    ctx.beginPath();

    ctx.roundRect(
        barX,
        barY,
        barWidth *
        force /
        MAX_FORCE,
        barHeight,
        4
    );

    ctx.fill();


    document.getElementById(
        "forceText"
    ).textContent =
        "Сила: " +
        Math.round(force) +
        " / 200";
}


/* =====================================================
   СЛЕД
===================================================== */

function drawTrail() {

    /*
       След использует главный цвет игрока.
    */

    const trailColor =
        hexToRgb(
            color1.value
        );


    for (
        let i = 0;
        i < cube.trail.length;
        i++
    ) {

        const p =
            cube.trail[i];


        const x =
            p.x -
            camera.x;

        const y =
            p.y -
            camera.y;


        const alpha =
            i /
            cube.trail.length *
            .25;


        const size =
            cube.size *
            i /
            cube.trail.length;


        ctx.fillStyle =
            `rgba(
                ${trailColor.r},
                ${trailColor.g},
                ${trailColor.b},
                ${alpha}
            )`;


        ctx.fillRect(
            x - size / 2,
            y - size / 2,
            size,
            size
        );
    }
}


/* =====================================================
   ПИКСЕЛЬНЫЙ КУБ
===================================================== */

function drawCube() {

    const x =
        cube.x -
        camera.x;

    const y =
        cube.y -
        camera.y;

    const pixelSize =
        cube.size / 8;

    ctx.save();

    /*
       Рисуем каждый пиксель
       с его собственной прозрачностью.
    */

    for (
        let py = 0;
        py < 8;
        py++
    ) {

        for (
            let px = 0;
            px < 8;
            px++
        ) {

            const color =
                pixels[py][px];

            if (!color)
                continue;

            ctx.fillStyle =
                `rgba(
                    ${color.r},
                    ${color.g},
                    ${color.b},
                    ${color.a}
                )`;

            /*
               Свечение зависит от alpha
               конкретного пикселя.
            */

            ctx.shadowBlur =
                25 * color.a;

            ctx.shadowColor =
                `rgba(
                    ${color.r},
                    ${color.g},
                    ${color.b},
                    ${color.a}
                )`;

            ctx.fillRect(

                x -
                cube.size / 2 +
                px * pixelSize,

                y -
                cube.size / 2 +
                py * pixelSize,

                pixelSize + 0.5,

                pixelSize + 0.5
            );
        }
    }

    /*
       Пустые клетки.
    */

    ctx.shadowBlur = 0;

    ctx.fillStyle =
        "rgba(255,255,255,.03)";

    for (
        let py = 0;
        py < 8;
        py++
    ) {

        for (
            let px = 0;
            px < 8;
            px++
        ) {

            if (pixels[py][px])
                continue;

            ctx.fillRect(

                x -
                cube.size / 2 +
                px * pixelSize,

                y -
                cube.size / 2 +
                py * pixelSize,

                pixelSize,

                pixelSize
            );
        }
    }

    ctx.restore();
}

function gameLoop(currentTime) {

    requestAnimationFrame(gameLoop);

    if (
        !gameScreen.classList.contains("active")
    ) {
        lastTime = currentTime;
        return;
    }

    // Сколько времени прошло с прошлого кадра
    let frameTime =
        (currentTime - lastTime) / 1000;

    lastTime = currentTime;

    // Если телефон завис/свернул вкладку,
    // не пытаемся просчитать огромный промежуток
    frameTime = Math.min(frameTime, 0.1);

    accumulator += frameTime;

    /*
       ФИЗИКА ВСЕГДА ИДЁТ С ШАГОМ 1/60 СЕКУНДЫ.

       120 FPS:
       render → physics → render → physics...

       60 FPS:
       render → physics...

       30 FPS:
       render → physics → physics → render...

       Поэтому скорость игры не зависит
       от количества кадров.
    */
    while (accumulator >= FIXED_DT) {

        update();

        accumulator -= FIXED_DT;
    }

    // Рендер может работать с любым FPS
    drawBackground();

    ctx.save();

    ctx.translate(
        canvas.width / 2,
        canvas.height / 2
    );

    ctx.scale(
        camera.zoom,
        camera.zoom
    );

    ctx.translate(
        -canvas.width / 2,
        -canvas.height / 2
    );

    drawTrail();

    drawBlocks();

    drawAim();

    drawCube();

    ctx.restore();

    drawWorldPosition();

}

requestAnimationFrame(gameLoop);


</script>

</body>
</html>
